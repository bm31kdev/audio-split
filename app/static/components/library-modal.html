<!-- Full application page for the local project library. -->
<section id="libraryModal" class="app-page projects-page hidden" aria-labelledby="libraryTitle">
  <header class="projects-page-header"><div><p class="eyebrow" data-i18n="projects.eyebrow">ESPACE DE TRAVAIL</p><h2 id="libraryTitle">Mes projets</h2><p id="libraryDescription">Vos dossiers et séparations enregistrés sur cet ordinateur.</p></div><button type="button" data-button-variant="primary" data-page="home" id="projectsBackButton" data-i18n="nav.home">Accueil</button></header>
  <div class="library-content">
    <div id="saveProjectPanel" class="save-project-panel"><div><h3 id="saveProjectHeading">Enregistrer ce mix dans un projet</h3><p id="saveProjectHint">Choisissez un dossier et vérifiez le nom du projet avant de l’enregistrer.</p></div><div class="save-project-controls"><select id="saveFolderSelect" aria-label="Dossier du projet"></select><input id="projectNameInput" type="text" maxlength="120" placeholder="Nom du projet"><button data-button-variant="secondary" id="saveProjectButton" class="primary" type="button">Enregistrer</button></div></div>
    <div id="libraryStorage" class="library-storage" aria-live="polite"></div>
    <div class="library-toolbar"><input id="newFolderName" type="text" maxlength="80" placeholder="Nom du nouveau dossier"><button data-button-variant="secondary" id="createFolderButton" class="primary" type="button">Créer un dossier</button><button data-button-variant="secondary" id="importProjectButton" type="button">Importer un projet</button><input id="projectArchiveInput" type="file" accept=".zip,application/zip" hidden></div>
    <div class="library-search-row"><input id="projectSearchInput" type="search" placeholder="Rechercher un projet…"><select id="projectSortSelect" aria-label="Trier les projets"><option value="updated">Plus récents</option><option value="name">Nom</option><option value="size">Taille</option><option value="created">Date de création</option></select></div>
    <div id="libraryWorkspace" class="library-workspace"></div>
  </div>
</section>
