<div id="automationEffectModal" class="fx-modal automation-effect-modal" aria-hidden="true">
  <div class="fx-modal-backdrop" data-modal-close></div>
  <section class="fx-dialog automation-effect-dialog app-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="automationEffectTitle">
    <header class="changelog-header">
      <div>
        <p class="eyebrow">AUDIO SPLIT STUDIO</p>
        <h2 id="automationEffectTitle" data-i18n="automation.effectRemoveTitle">Supprimer cet effet ?</h2>
        <p id="automationEffectDescription">Effet actif sur cette piste.</p>
      </div>
      <button type="button" data-button-variant="modal" class="changelog-close automation-effect-close" data-modal-close data-i18n-title="close" data-i18n-aria-label="close" aria-label="Fermer" title="Fermer">
        <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="interaction-content automation-effect-content">
      <p id="automationEffectMessage" class="interaction-message" data-i18n="automation.effectRemoveHint">L’effet et ses points d’automatisation seront retirés de cette piste.</p>
    </div>
    <footer class="interaction-actions automation-effect-actions">
      <button type="button" data-button-variant="modal" data-modal-close data-i18n="interaction.cancel">Annuler</button>
      <button type="button" class="audio-button" data-button-variant="danger" data-automation-effect-action="remove"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg><span data-i18n="automation.effectRemove">Supprimer l’effet</span></button>
    </footer>
  </section>
</div>
