<!-- Studio and local storage preferences. -->
<div id="settingsModal" class="changelog-modal settings-modal" aria-hidden="true">
  <div class="changelog-backdrop" data-modal-close></div>
  <section class="changelog-dialog settings-dialog app-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <header class="changelog-header">
      <div>
        <p class="eyebrow">AUDIO SPLIT STUDIO</p>
        <h2 id="settingsModalTitle" data-i18n="settings.heading">Paramètres</h2>
        <p data-i18n="settings.description">Réglez le moteur de séparation et la gestion du stockage local.</p>
      </div>
      <button type="button" data-button-variant="modal" class="changelog-close settings-close" data-modal-close data-i18n-title="close" data-i18n-aria-label="close" title="Fermer" aria-label="Fermer">
        <svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="settings-content">
      <section class="settings-engine" aria-labelledby="settingsEngineTitle">
        <h3 id="settingsEngineTitle" data-i18n="engine.settingsTitle">Moteur de séparation</h3>
        <p data-i18n="engine.settingsDescription">Choisissez le modèle Demucs utilisé pour les prochaines séparations.</p>
        <label for="separationEngineSelect"><span data-i18n="engine.settingsLabel">Modèle</span>
          <select id="separationEngineSelect" aria-label="Moteur de séparation" data-i18n-aria-label="engine.settingsTitle">
            <option value="mdx" data-i18n="engine.mdx">MDX · rapide sur CPU</option>
            <option value="mdx_fast" data-i18n="engine.mdxFast">MDX rapide · fenêtres courtes</option>
            <option value="mdx_extra" data-i18n="engine.mdxExtra">MDX Extra · modèle alternatif</option>
            <option value="mdx_extra_fast" data-i18n="engine.mdxExtraFast">MDX Extra rapide · fenêtres courtes</option>
            <option value="htdemucs" data-i18n="engine.htdemucs">HTDemucs · polyvalent</option>
            <option value="htdemucs_fast" data-i18n="engine.htdemucsFast">HTDemucs rapide · fenêtres courtes</option>
            <option value="htdemucs_ft" data-i18n="engine.htdemucsFt">HTDemucs FT · plus précis, plus lent</option>
            <option value="hdemucs_mmi" data-i18n="engine.hdemucsMmi">HDemucs MMI · modèle alternatif</option>
          </select>
        </label>
        <p class="settings-engine-note" data-i18n="engine.downloadNote">Un modèle peut être téléchargé lors de sa première utilisation.</p>
      </section>
      <div class="settings-cache-action">
        <button data-button-variant="danger" id="clearCacheButton" class="cache-button" type="button" data-i18n-title="cache.title" title="Supprimer les séparations et fichiers audio mis en cache sur ce PC"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5m4-5v5"/></svg><span data-i18n="cache.clear">Vider le cache AudioSplit</span></button>
      </div>
      <button type="button" class="settings-version-link" id="releaseDetailsButton" data-i18n="settings.versionDetails">AudioSplit Studio · v1.6.0</button>
    </div>
  </section>
</div>
