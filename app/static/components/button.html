<!-- Shared, reusable AudioSplit button template.
     Visual variants are selected through data-button-variant on the element. -->
<template id="audioSplitButtonTemplate">
  <button class="audio-button" data-audio-button data-button-variant="secondary" type="button">
    <span data-button-icon hidden></span>
    <span data-button-label></span>
  </button>
</template>
