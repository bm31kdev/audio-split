<div id="automationModal" class="fx-modal" aria-hidden="true">
  <div class="fx-modal-backdrop" data-modal-close></div>
  <section class="fx-dialog automation-dialog" role="dialog" aria-modal="true" aria-labelledby="automationTitle">
    <header class="changelog-header"><div><p class="eyebrow" data-i18n="automation.eyebrow">AUTOMATION</p><h2 id="automationTitle">Automation — Track</h2><p data-i18n="automation.description">Add volume and effect changes at the playhead.</p></div><button type="button" data-button-variant="modal" class="changelog-close automation-close" data-modal-close data-i18n-title="close" aria-label="Close"><svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button></header>
    <div class="automation-editor-content">
      <label class="automation-lane-select"><span data-i18n="automation.lane">Parameter to automate</span><select id="automationLaneSelect"></select></label>
      <div class="automation-curve-heading"><span id="automationPlayheadLabel">Playhead · 0:00</span><span data-i18n="automation.hint">Click to add a point · Drag a point to move it</span></div>
      <canvas id="automationCurve" class="automation-curve" aria-label="Automation curve" data-i18n-aria-label="automation.curveLabel"></canvas>
      <ol id="automationKeyframeList" class="automation-keyframe-list"></ol>
    </div>
    <button type="button" data-button-variant="modal" class="fx-done" data-modal-close data-i18n="fx.done">Close</button>
  </section>
</div>
