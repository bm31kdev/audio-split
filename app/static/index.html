<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AudioSplit Studio</title><link rel="stylesheet" href="/static/style.css?v=1.0.3">
</head>
<body>
  <main>
    <header><div><h1>AudioSplit <span>Studio</span></h1><p>Séparez. Mixez. Exportez.</p></div><div class="local">● Traitement local</div></header>
    <section class="hero"><p class="eyebrow">STUDIO DE STEMS</p><h2>Redonnez de l’espace<br>à votre musique.</h2><p>Extrayez la voix, ajustez chaque piste et créez votre version stéréo.</p></section>
    <section id="importCard" class="card import-card">
      <input id="fileInput" type="file" accept="audio/mpeg,audio/wav,audio/flac,audio/mp4,audio/ogg,.mp3,.wav,.flac,.m4a,.ogg" hidden>
      <div class="upload-icon" aria-hidden="true"><svg class="upload-arrow" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#d7ff54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v4a1 1 0 001 1h12a1 1 0 001-1v-4"/></svg></div><h3>Importez votre morceau</h3><p>MP3, WAV, FLAC, M4A ou OGG</p>
      <fieldset class="split-mode"><legend>Type de séparation</legend><label><input type="radio" name="splitMode" value="simple" checked> Voix + accompagnement</label><label><input type="radio" name="splitMode" value="detailed"> Détaillée : voix, batterie, basse, instruments</label></fieldset>
      <button id="chooseButton">Choisir un fichier</button><strong id="fileName"></strong>
      <button id="separateButton" class="primary" disabled>Séparer la voix et l'accompagnement</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
    <section id="mixer" class="mixer hidden">
      <div class="mixer-top"><div><p class="eyebrow">MIXAGE</p><h2>Vos pistes</h2></div><div class="transport"><button id="playButton" class="play" aria-label="Écouter le mix" title="Écouter le mix"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><button id="stopButton" aria-label="Arrêter" title="Arrêter" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7z"/></svg></button></div></div>
      <div id="tracks" class="tracks"></div>
      <button id="exportButton" class="export">↓ Exporter le mixage WAV stéréo</button>
    </section>
  </main><script src="/static/app.js?v=1.0.3"></script>
</body></html>
